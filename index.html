<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta
      name="description"
      content="Planejador de gravações externas: encontre as melhores horas para gravar com base na previsão do tempo e na golden hour."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Janela de Luz" />
    <meta
      property="og:description"
      content="Encontre a melhor hora para gravar externas: previsão hora a hora, golden hour e nota de gravação."
    />
    <title>Janela de Luz</title>
    <script>
      // Aplica o tema antes da primeira pintura, para a tela não piscar no tema errado.
      // Mesma regra do hook useTema: vale a escolha salva; sem escolha, segue o sistema.
      ;(function () {
        var escolha = null
        try {
          escolha = JSON.parse(localStorage.getItem('janela-de-luz:tema'))
        } catch (erro) {
          // sem acesso ao armazenamento: segue o sistema
        }
        var escuro =
          escolha === 'escuro' ||
          (escolha !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = escuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
